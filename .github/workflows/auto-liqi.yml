name: 🤖 Auto Liqi

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-liqi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip httpx protobuf "betterproto[compiler]==2.0.0b7" "UnityPy==1.24.2"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "v28.2"

      # 雀魂换成 Unity 客户端后官网 liqi.json 停更，改从 MajsoulData 的 Release 取 liqi.desc
      - name: Download liqi.desc from MajsoulData
        id: liqi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ./MajsoulUID/utils/proto/update_proto.py --desc liqi.desc

      - name: Generate python code from liqi.desc
        run: protoc --descriptor_set_in=liqi.desc --python_betterproto_out=./MajsoulUID/lib ${{ steps.liqi.outputs.proto_files }}

      - name: Update skin table and avatars
        run: python ./MajsoulUID/utils/proto/update_skin.py

      - name: Remove files
        run: rm -f liqi.desc

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email actions@noreply.github.com

      - name: Commit changes
        run: |
          git add -A MajsoulUID/lib MajsoulUID/utils/proto MajsoulUID/utils/texture2d/bighead
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "🤖 自动更新 \`Liqi\`"
            git push
          fi
