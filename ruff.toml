# 照抄 Core 根 ruff.toml：单独 clone（pre-commit-ci）时找不到 Core 的配置
line-length = 120
target-version = "py312"
# protoc + betterproto 生成物，不做检查
extend-exclude = ["MajsoulUID/lib/lq"]

[lint]
select = ["E", "F", "I", "W", "ASYNC"]
ignore = ["ASYNC109"]

[lint.isort]
force-sort-within-sections = false
combine-as-imports = true
length-sort = true
# 单独 clone 时装不到 gsuid_core，不写死会被当成第三方库
known-first-party = ["gsuid_core"]
extra-standard-library = ["typing_extensions"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder"
]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
exclude = ["**/*.md"]
